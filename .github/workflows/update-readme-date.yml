name: Update README date

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch: # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  update-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update date in README
        run: |
          TODAY=$(date -u +"%Y-%m-%d")
          sed -i "s/^Last updated: .*/Last updated: ${TODAY}/" README.md

      - name: Commit and push if changed
        run: |
          git config user.name "Aron"
          git config user.email "aronsegoviamartinez@gmail.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: update README date to $(date -u +%Y-%m-%d)"
            git push
          fi
